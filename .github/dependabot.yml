# Expo pins compatible versions of its packages to the SDK (use `npx expo install` to upgrade),
# so Dependabot only opens npm pull requests for security fixes (limit 0 = security updates only).
# GitHub Actions are updated weekly as usual.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Bucharest
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Bucharest
    groups:
      actions:
        patterns: ["*"]
